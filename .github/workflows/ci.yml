name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: freebird
          POSTGRES_PASSWORD: freebird
          POSTGRES_DB: freebird_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U freebird"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://freebird:freebird@localhost:5432/freebird_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgres://freebird:freebird@localhost:5432/freebird_test
          SESSION_SECRET: ci-only-session-secret-that-is-long-enough-123
          APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
